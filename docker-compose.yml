services:
  data:
    image: busybox:1.35-uclibc
    container_name: data-container
    volumes:
      - data-volume:/data

  backend:
    build:
      context: ./backend
    container_name: backend
    ports:
      - "8000:8000"
    volumes:
      - data-volume:/app/data
    depends_on:
      - data
    networks:
      - flix_network

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_HOST=backend
    volumes:
      - data-volume:/app/data
    depends_on:
      - backend
    networks:
      - flix_network

volumes:
  data-volume:

networks:
  flix_network:
    driver: bridge