services:
  backend:
    build:
      context: ./backend
    container_name: backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    networks:
      - flix_network
  frontend:
    build:
      context: ./frontend
    container_name: frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_HOST=backend
    volumes:
      - ./data:/app/data
    depends_on:
      - backend
    networks:
      - flix_network
networks:
  flix_network:
    driver: bridge